build:
  maxIssues: 0
style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    active: false
  WildcardImport:
    active: false
complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 14
  TooManyFunctions:
    active: false
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
