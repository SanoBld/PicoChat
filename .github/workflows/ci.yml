name: CI

# Fast checks on every pull request: unit tests, lint, detekt.
on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Detekt
        run: ./gradlew detekt --no-daemon
      - name: Unit tests
        run: ./gradlew :shared:desktopTest :shared:testDebugUnitTest --no-daemon
      - name: Android lint
        run: ./gradlew :androidApp:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            shared/build/reports
            androidApp/build/reports
            build/reports
