name: Build Linux

# Native build per CPU (jpackage can't cross-compile). Output: .deb, .rpm, .AppImage and a zip.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            zip: picochat-linux.zip            # name kept: used by the updater
          - arch: arm64
            runner: ubuntu-24.04-arm
            zip: picochat-linux-arm64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot cmake build-essential libfuse2 || sudo apt-get install -y rpm fakeroot cmake build-essential

      - name: Build native llama library
        run: |
          cmake -S native/desktop -B native/build -DCMAKE_BUILD_TYPE=Release -DPICO_OUT="$PWD/desktopApp/native-libs/linux-${{ matrix.arch }}"
          cmake --build native/build --config Release -j
          ls -la desktopApp/native-libs/linux-${{ matrix.arch }}

      - name: Package
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${IN_VERSION:-0.0.0-dev.${{ github.run_number }}}"
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDeb :desktopApp:packageRpm -PversionName="$VERSION" --no-daemon --stacktrace

      - name: Rename outputs
        run: |
          B=desktopApp/build/compose/binaries/main
          cp "$(find $B/deb -name '*.deb' | head -1)" PicoChat-linux-${{ matrix.arch }}.deb
          cp "$(find $B/rpm -name '*.rpm' | head -1)" PicoChat-linux-${{ matrix.arch }}.rpm
          python3 -m zipfile -c ${{ matrix.zip }} $B/app/PicoChat
          bash scripts/build-appimage.sh ${{ matrix.arch }} PicoChat-linux-${{ matrix.arch }}.AppImage
          cp scripts/install-linux.sh install-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: picochat-linux-${{ matrix.arch }}
          path: |
            ${{ matrix.zip }}
            PicoChat-linux-${{ matrix.arch }}.deb
            PicoChat-linux-${{ matrix.arch }}.rpm
            PicoChat-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: install-linux-script
          path: install-linux.sh
