name: Build Android

# Reusable (called by build-all.yml / release.yml) and runnable by hand.
# Builds once, then uploads the universal APK and one APK per CPU architecture.
# File names are what the in-app updater looks for: do not rename them.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      # llama.cpp is compiled with NDK 29 (see llama/build.gradle.kts).
      - name: Accept licenses and install NDK / CMake
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;29.0.13113456" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build release APKs
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${IN_VERSION:-0.0.0-dev.${{ github.run_number }}}"
          for attempt in 1 2 3; do
            if ./gradlew :androidApp:assembleRelease -PversionName="$VERSION" -PversionCode=${{ github.run_number }} --no-daemon --stacktrace; then exit 0; fi
            echo "Attempt $attempt failed, retrying in 20 s..."
            sleep 20
          done
          exit 1

      - name: Collect APKs
        shell: bash
        run: |
          ls -la androidApp/build/outputs/apk/release
          for abi in universal arm64-v8a armeabi-v7a x86_64; do
            ./gradlew collectFile -PfileDir=androidApp/build/outputs/apk/release -PfileSrc=androidApp-$abi-release.apk -PfileName=app-$abi-release.apk --no-daemon -q
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error
