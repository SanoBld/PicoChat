name: Build macOS

# Native build per CPU (a universal build is not possible with jpackage). Output: .dmg and zip.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            zip: picochat-macos-arm64.zip
            dmg: PicoChat-macos-arm64.dmg
          - arch: x64
            runner: macos-15-intel
            zip: picochat-macos-x64.zip
            dmg: PicoChat-macos-x64.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build native llama library
        run: |
          cmake -S native/desktop -B native/build -DCMAKE_BUILD_TYPE=Release -DPICO_OUT="$PWD/desktopApp/native-libs/macos-${{ matrix.arch }}"
          cmake --build native/build --config Release -j
          ls -la desktopApp/native-libs/macos-${{ matrix.arch }}

      - name: Package
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${IN_VERSION:-0.0.0-dev.${{ github.run_number }}}"
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDmg -PversionName="$VERSION" --no-daemon --stacktrace

      - name: Rename outputs
        run: |
          B=desktopApp/build/compose/binaries/main
          cp "$(find $B/dmg -name '*.dmg' | head -1)" ${{ matrix.dmg }}
          ditto -c -k --keepParent $B/app/PicoChat.app ${{ matrix.zip }}

      - uses: actions/upload-artifact@v4
        with:
          name: picochat-macos-${{ matrix.arch }}
          path: |
            ${{ matrix.zip }}
            ${{ matrix.dmg }}
          if-no-files-found: error
