name: Build PicoChat

# Runs on every push touching app code: builds the APKs for verification only
# (no GitHub Release; releases are handled by release.yml).
on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'llama/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-*.yml'
  workflow_dispatch: {}

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips automated commits that contain "[skip ci]" (release.yml's version bump).
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          MSG=$(git log -1 --pretty=%B)
          if [[ "$MSG" == *"[skip ci]"* ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  android:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    uses: ./.github/workflows/build-android.yml
