name: Release PicoChat

# Two ways to trigger a real release:
#  1) Push a tag like v1.0.0 (or v1.0.0-beta for a pre-release)
#  2) Run this workflow manually from the Actions tab (workflow_dispatch)
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release? (beta, rc...)'
        type: boolean
        required: false
        default: false
      version:
        description: 'Version to release (e.g. 1.0.1)'
        required: true

jobs:
  # Resolves tag / version / prerelease BEFORE the build so they can be passed
  # down as inputs (the build job does its own checkout).
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag:        ${{ steps.meta.outputs.tag }}
      version:    ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes:      ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag, version and prerelease flag
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_PRE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$IN_VERSION"
            if [ "$IN_PRE" = "true" ] && [[ "$VERSION" != *"-"* ]]; then VERSION="${VERSION}-beta"; fi
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-"* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      # Takes the lines between "## vX.Y.Z" and the next "## " heading of CHANGELOG.md.
      - name: Extract changelog entry
        id: changelog
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          NOTES=$(awk -v heading="## $TAG" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null | sed -e '/./,$!d')
          [ -z "$NOTES" ] && NOTES="_(No changelog entry for $TAG)_"
          { echo "notes<<CHANGELOG_EOF"; echo "$NOTES"; echo "CHANGELOG_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" || true
          git push origin "$TAG" || true

      # Keeps appVersionName / appVersionCode in gradle.properties in sync, so local builds
      # report the right version too (CI builds already override them with -P flags).
      - name: Sync gradle.properties version and commit
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          sed -i "s/^appVersionName=.*/appVersionName=$VERSION/; s/^appVersionCode=.*/appVersionCode=$RUN/" gradle.properties
          if git diff --quiet -- gradle.properties; then
            echo "Already up to date."
          else
            git add gradle.properties
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin HEAD:"$BRANCH"
          fi

  android:
    needs: resolve
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.resolve.outputs.version }}

  publish-release:
    needs: [ resolve, android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets/

      - name: Flatten asset folder
        run: |
          mkdir -p flat-assets
          find release-assets -type f -exec cp {} flat-assets/ \;
          ls -la flat-assets

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          name: "PicoChat v${{ needs.resolve.outputs.version }}"
          artifacts: "flat-assets/*"
          generateReleaseNotes: true
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          makeLatest: ${{ needs.resolve.outputs.prerelease == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## PicoChat v${{ needs.resolve.outputs.version }}

            ${{ needs.resolve.outputs.notes }}

            ### Android
            | File | Use case |
            |------|----------|
            | `app-universal-release.apk` | Works on any phone (biggest file) |
            | `app-arm64-v8a-release.apk` | Most modern phones (2018+) |
            | `app-armeabi-v7a-release.apk` | Older 32-bit phones |
            | `app-x86_64-release.apk` | Emulators / x86 tablets |
