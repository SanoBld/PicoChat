name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "Steps to reproduce and what you expected"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "PicoChat version"
  - type: input
    id: device
    attributes:
      label: "Device and Android version"
  - type: input
    id: model
    attributes:
      label: "Model used (local GGUF or cloud)"
